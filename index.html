<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atom Simulator</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=EB+Garamond:wght@500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div id="app">
        <div id="plate-column">

            <div id="main-panel">
                <canvas id="background"></canvas>
            </div>

            <p id="caption">
                <span id="element-symbol">C</span>
                <span id="caption-text">
                    <span id="element-name">Carbon-12</span> — atomic no. <span id="atomic-number">6</span>, mass no. <span id="mass-number">12</span>, charge <span id="charge">0</span> (<span id="ion-type">Neutral</span>)
                </span>
            </p>

        </div>
   


    <div id="isotope-panel">

        <h2>Isotope</h2>

        <div id="isotope-name">Carbon-12</div>
        <div class="property">

            <span>Status</span>
            <span id="isotope-status">Stable</span>

        </div>
        <div class="property">
            <span>Element</span>
            <span id="isotope-element">Carbon</span>
        </div>

        <div class="property">
            <span>Symbol</span>
            <span id="isotope-symbol">C</span>
        </div>

        <div class="property">
            <span>Atomic Number</span>
            <span id="isotope-atomic-number">6</span>

        </div>

        <div class="property">

            <span>Mass Number</span>
            <span id="isotope-mass-number">12</span>

        </div>
        <div class="property">

            <span>Atomic Mass</span>

            <span id="isotope-atomic-mass"></span>

        </div>
        <div class="property">

            <span>Neutrons</span>
            <span id="isotope-neutrons">6</span>

        </div>

        

        <div class="property">

            <span>Half-life</span>
            <span id="isotope-half-life">—</span>

        </div>

        <div class="property">

            <span>Decay Mode</span>
            <span id="isotope-decay-mode">—</span>

        </div>

        <div class="property">

            <span>Spin / Parity</span>

            <span id="isotope-spin-parity">—</span>

        </div>
        

    </div>

</div>



<div id="controls">

    <div class="control">

        <span>Protons</span>
        <button id="proton-remove-10">-10</button>
        <button id="proton-remove">-</button>
        <input id="proton-count" type="number" min="1" max="118" value="6">        
        <button id="proton-add">+</button>
        <button id="proton-add-10">+10</button>
        
        

    </div>


    <div class="control">

        <span>Neutrons</span>

        <button id="neutron-remove-10">-10</button>
        <button id="neutron-remove">-</button>

        <input id="neutron-count" type="number" min="0" value="6">
        <button id="neutron-add">+</button>
        <button id="neutron-add-10">+10</button>


    </div>


    <div class="control">

        <span>Electrons</span>
        <button id="electron-remove-10">-10</button>
        <button id="electron-remove">-</button>
        <input id="electron-count" type="number" min="0" value="6">
        <button id="electron-add">+</button>

        <button id="electron-add-10">+10</button>
    </div>

</div>

<button id="periodic-table-toggle">Atlas</button>

<div id="periodic-backdrop"></div>
<div id="periodic-table">
    <h2>Atlas</h2>
    
    <div id="element-grid"></div>
</div>




</body>


<script src="script.js"></script>

</html>
